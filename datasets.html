        function renderDatasets(list) {
            const grid = document.getElementById('datasets-grid');
            grid.innerHTML = '';
            list.forEach(ds => {
                const card = document.createElement('div');
                card.className = 'dataset-card bg-zinc-900 border border-zinc-800 rounded-3xl p-6 cursor-pointer';
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <span class="px-3 py-1 text-xs rounded-full bg-${ds.color}-900/60 text-${ds.color}-400">${ds.type}</span>
                            <h3 class="font-semibold text-xl mt-3">${ds.title}</h3>
                            <p class="text-xs text-zinc-400">${ds.subtitle}</p>
                        </div>
                        <i class="fa-solid ${ds.icon} text-3xl text-${ds.color}-400"></i>
                    </div>
                    <p class="text-sm text-zinc-400 line-clamp-3 mb-4">${ds.shortDesc}</p>
                    <div class="pt-4 border-t border-zinc-700 flex justify-between items-center text-xs">
                        <span class="text-zinc-500">${ds.source}</span>
                        <button onclick="event.stopImmediatePropagation(); showDatasetDetail('${ds.id}')" class="px-4 py-1.5 text-xs bg-violet-600 hover:bg-violet-500 text-white rounded-xl font-medium flex items-center gap-x-1.5 transition">
                            <i class="fa-solid fa-info-circle"></i> <span>查看详情</span>
                        </button>
                    </div>
                `;
                card.onclick = () => showDatasetDetail(ds.id);
                grid.appendChild(card);
            });
            document.getElementById('dataset-count').innerText = list.length;
        }

        function filterByCategory(category) {
            const tabs = document.querySelectorAll('#category-tabs button');
            tabs.forEach(t => t.classList.remove('active', 'bg-violet-600', 'border-violet-600'));
            let activeTab = Array.from(tabs).find(t => t.getAttribute('onclick') === `filterByCategory('${category}')`);
            if (activeTab) activeTab.classList.add('active', 'bg-violet-600', 'border-violet-600');

            const filtered = category === 'all' ? allDatasets : allDatasets.filter(d => d.category === category);
            renderDatasets(filtered);
        }

        let currentDataset = null;

        function showDatasetDetail(id) {
            currentDataset = allDatasets.find(d => d.id === id);
            if (!currentDataset) return;

            document.getElementById('modal-title').innerText = currentDataset.title;
            document.getElementById('modal-subtitle').innerText = currentDataset.subtitle;

            const badge = document.getElementById('modal-type-badge');
            badge.innerHTML = `<span class="px-3 py-1 text-xs rounded-full bg-${currentDataset.color}-900/60 text-${currentDataset.color}-400">${currentDataset.type}</span>`;

            document.getElementById('modal-description').innerHTML = currentDataset.description || currentDataset.shortDesc;
            document.getElementById('modal-paradigm').innerHTML = currentDataset.paradigm || '详见论文';
            document.getElementById('modal-volume').innerHTML = currentDataset.volume || '详见官网';
            document.getElementById('modal-method').innerHTML = currentDataset.method || '详见论文';

            const dlDiv = document.getElementById('modal-download-links');
            dlDiv.innerHTML = '';
            (currentDataset.downloadLinks || []).forEach(link => {
                const a = document.createElement('a');
                a.href = link.url; a.target = '_blank';
                a.className = 'block px-5 py-3.5 bg-zinc-950 border border-zinc-700 hover:border-emerald-500 rounded-2xl transition flex justify-between items-center text-sm';
                a.innerHTML = `<span class="font-medium">${link.label}</span><span class="text-emerald-400 text-xs flex items-center gap-x-1">${link.note || ''} <i class="fa-solid fa-external-link-alt"></i></span>`;
                dlDiv.appendChild(a);
            });

            document.getElementById('dataset-modal').classList.remove('hidden');
            document.getElementById('dataset-modal').classList.add('flex');
            switchTab(0);
        }

        function switchTab(tabIndex) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('active', 'border-violet-500', 'text-white'));
            const activeContent = document.getElementById('tab-content-' + tabIndex);
            if (activeContent) activeContent.classList.remove('hidden');
            const activeBtn = document.getElementById('tab-' + tabIndex);
            if (activeBtn) activeBtn.classList.add('active', 'border-violet-500', 'text-white');
        }

        function closeModal() {
            document.getElementById('dataset-modal').classList.remove('flex');
            document.getElementById('dataset-modal').classList.add('hidden');
        }

        function copyDatasetInfo() {
            if (!currentDataset) return;
            const text = `${currentDataset.title} (${currentDataset.subtitle})\n\n${currentDataset.description}\n\n范式: ${currentDataset.paradigm}\n规模: ${currentDataset.volume}\n\n下载链接:\n${(currentDataset.downloadLinks || []).map(l => `- ${l.label}: ${l.url}`).join('\n')}`;
            navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板'));
        }

        // Init
        window.onload = function() {
            renderDatasets(allDatasets);
            const firstTab = document.querySelector('#category-tabs button');
            if (firstTab) firstTab.classList.add('active', 'bg-violet-600', 'border-violet-600');
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('dataset-modal');
                if (!modal.classList.contains('hidden')) closeModal();
            }
        });
    </script>
</body>
</html>
